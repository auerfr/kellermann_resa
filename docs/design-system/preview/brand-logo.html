<!DOCTYPE html>
<html lang="fr">
<head><meta charset="UTF-8">
<style>
@font-face{font-family:'Open Sans';font-style:normal;font-weight:300 800;font-stretch:75% 125%;font-display:swap;src:url('../fonts/OpenSans-VariableFont_wdth_wght.ttf') format('truetype-variations'),url('../fonts/OpenSans-VariableFont_wdth_wght.ttf') format('truetype');}
@font-face{font-family:'Open Sans';font-style:italic;font-weight:300 800;font-stretch:75% 125%;font-display:swap;src:url('../fonts/OpenSans-Italic-VariableFont_wdth_wght.ttf') format('truetype-variations'),url('../fonts/OpenSans-Italic-VariableFont_wdth_wght.ttf') format('truetype');}
</style>

<title>Brand</title>
<style>
  body{margin:0;font-family:'Open Sans','Segoe UI',Arial,sans-serif;background:#fff;color:#1E293B;padding:20px;display:flex;align-items:center;gap:28px;}
  .mark{width:140px;height:140px;background:#0F2137;border-radius:20px;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 8px 24px rgba(0,0,0,.13);}
  .mark svg{width:96px;height:96px;}
  .wordmark{font-size:34px;font-weight:700;color:#0F2137;letter-spacing:-.01em;line-height:1;}
  .wordmark-small{font-size:13px;font-weight:600;color:#64748B;margin-top:6px;letter-spacing:.02em;}
  .inline{display:inline-flex;align-items:center;gap:10px;background:#0F2137;color:#C8A84B;padding:10px 16px;border-radius:10px;margin-top:16px;font-weight:700;font-size:18px;}
  .inline svg{width:26px;height:26px;}
  .eyebrow{font-size:11px;color:#94A3B8;text-transform:uppercase;letter-spacing:.08em;font-weight:600;margin-bottom:6px;}
</style></head>
<body>
  <div class="mark">
    <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M8 22 L32 8 L56 22 Z" stroke="#C8A84B" stroke-width="2.5" stroke-linejoin="round"/>
      <rect x="10" y="22" width="44" height="4" fill="#C8A84B"/>
      <rect x="14" y="26" width="4" height="24" fill="#C8A84B"/>
      <rect x="24" y="26" width="4" height="24" fill="#C8A84B"/>
      <rect x="36" y="26" width="4" height="24" fill="#C8A84B"/>
      <rect x="46" y="26" width="4" height="24" fill="#C8A84B"/>
      <rect x="10" y="50" width="44" height="4" fill="#C8A84B"/>
    </svg>
  </div>
  <div>
    <div class="eyebrow">Logo — façade classique</div>
    <div class="wordmark">Kellermann</div>
    <div class="wordmark-small">Réservation de temples &amp; salles</div>
    <div class="inline">
      <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M8 22 L32 8 L56 22 Z" stroke="#C8A84B" stroke-width="3" stroke-linejoin="round"/>
        <rect x="10" y="22" width="44" height="4" fill="#C8A84B"/>
        <rect x="14" y="26" width="4" height="24" fill="#C8A84B"/>
        <rect x="24" y="26" width="4" height="24" fill="#C8A84B"/>
        <rect x="36" y="26" width="4" height="24" fill="#C8A84B"/>
        <rect x="46" y="26" width="4" height="24" fill="#C8A84B"/>
        <rect x="10" y="50" width="44" height="4" fill="#C8A84B"/>
      </svg>
      <span>Kellermann</span>
    </div>
  </div>
</body>
</html>
