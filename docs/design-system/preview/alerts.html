<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8">
<style>
@font-face{font-family:'Open Sans';font-style:normal;font-weight:300 800;font-stretch:75% 125%;font-display:swap;src:url('../fonts/OpenSans-VariableFont_wdth_wght.ttf') format('truetype-variations'),url('../fonts/OpenSans-VariableFont_wdth_wght.ttf') format('truetype');}
@font-face{font-family:'Open Sans';font-style:italic;font-weight:300 800;font-stretch:75% 125%;font-display:swap;src:url('../fonts/OpenSans-Italic-VariableFont_wdth_wght.ttf') format('truetype-variations'),url('../fonts/OpenSans-Italic-VariableFont_wdth_wght.ttf') format('truetype');}

<title>Alerts</title>
<style>
  body{margin:0;font-family:'Open Sans','Segoe UI',Arial,sans-serif;background:#fff;padding:16px;color:#1E293B;}
  .al{border-radius:10px;border:1px solid transparent;padding:.7rem 1rem;font-size:.875rem;margin-bottom:10px;}
  .success{background:#F0FDF4;color:#166534;border-color:#BBF7D0;}
  .warning{background:#FFFBEB;color:#92400E;border-color:#FDE68A;}
  .danger{background:#FEF2F2;color:#991B1B;border-color:#FECACA;}
  .info{background:#EFF6FF;color:#1E40AF;border-color:#BFDBFE;}
</style></head><body>
<div class="al success">✅ Aucune demande en attente — tout est à jour !</div>
<div class="al warning">⏳ <strong>Validation de saison en attente</strong> — L'équipe Kellermann attend votre réponse pour la saison 2026–2027.</div>
<div class="al danger">Code d'accès incorrect. Vérifiez auprès de votre vénérable.</div>
<div class="al info">💡 Le code d'accès annuel est distribué en début de saison par l'administrateur.</div>
</body></html>
