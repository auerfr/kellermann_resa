<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8">
<style>
@font-face{font-family:'Open Sans';font-style:normal;font-weight:300 800;font-stretch:75% 125%;font-display:swap;src:url('../fonts/OpenSans-VariableFont_wdth_wght.ttf') format('truetype-variations'),url('../fonts/OpenSans-VariableFont_wdth_wght.ttf') format('truetype');}
@font-face{font-family:'Open Sans';font-style:italic;font-weight:300 800;font-stretch:75% 125%;font-display:swap;src:url('../fonts/OpenSans-Italic-VariableFont_wdth_wght.ttf') format('truetype-variations'),url('../fonts/OpenSans-Italic-VariableFont_wdth_wght.ttf') format('truetype');}
</style>

<title>Temple identities</title>
<style>
  body{margin:0;font-family:'Open Sans','Segoe UI',Arial,sans-serif;background:#fff;padding:20px;color:#1E293B;}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
  .card{border-radius:10px;overflow:hidden;border:1px solid #F1F5F9;}
  .event{padding:10px 12px;font-size:12px;font-weight:600;}
  .meta{padding:8px 12px;font-size:10.5px;color:#64748B;background:#fff;}
  .name{font-weight:700;color:#1E293B;font-size:12px;margin-bottom:2px;}
  .hex{font-family:SFMono-Regular,Menlo,monospace;font-size:9.5px;color:#94A3B8;}
</style></head><body>
<div class="grid">
  <div class="card">
    <div class="event" style="background:#DBEAFE;color:#1a3a5c;border-left:4px solid #1a3a5c;">🌙 Temple Lafayette</div>
    <div class="meta"><div class="name">Lafayette</div><div class="hex">bg #DBEAFE · #1a3a5c</div></div>
  </div>
  <div class="card">
    <div class="event" style="background:#CCFBF1;color:#0d6e6e;border-left:4px solid #0d6e6e;">🌙 Temple Égalité</div>
    <div class="meta"><div class="name">Égalité</div><div class="hex">bg #CCFBF1 · #0d6e6e</div></div>
  </div>
  <div class="card">
    <div class="event" style="background:#FEF3C7;color:#78350F;border-left:4px solid #92400E;">🌙 Temple Fraternité</div>
    <div class="meta"><div class="name">Fraternité</div><div class="hex">bg #FEF3C7 · #92400E</div></div>
  </div>
  <div class="card">
    <div class="event" style="background:#EDE9FE;color:#4C1D95;border-left:4px solid #5B21B6;">🌙 Temple Liberté</div>
    <div class="meta"><div class="name">Liberté</div><div class="hex">bg #EDE9FE · #5B21B6</div></div>
  </div>
</div>
</body></html>
