<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8">
<style>
@font-face{font-family:'Open Sans';font-style:normal;font-weight:300 800;font-stretch:75% 125%;font-display:swap;src:url('../fonts/OpenSans-VariableFont_wdth_wght.ttf') format('truetype-variations'),url('../fonts/OpenSans-VariableFont_wdth_wght.ttf') format('truetype');}
@font-face{font-family:'Open Sans';font-style:italic;font-weight:300 800;font-stretch:75% 125%;font-display:swap;src:url('../fonts/OpenSans-Italic-VariableFont_wdth_wght.ttf') format('truetype-variations'),url('../fonts/OpenSans-Italic-VariableFont_wdth_wght.ttf') format('truetype');}
</style>

<title>Brand colors</title>
<style>
  html,body{margin:0;padding:0;}
  body{font-family:'Open Sans','Segoe UI',Arial,sans-serif;background:#fff;padding:18px;color:#1E293B;}
  .row{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;}
  .sw{border-radius:10px;overflow:hidden;border:1px solid #E2E8F0;background:#fff;}
  .chip{height:74px;display:flex;align-items:flex-end;padding:8px;font-size:10px;font-weight:600;letter-spacing:.02em;}
  .meta{padding:7px 10px;font-size:11px;border-top:1px solid #F1F5F9;}
  .name{font-weight:600;color:#1E293B;}
  .hex{color:#64748B;font-family:SFMono-Regular,Menlo,Consolas,monospace;font-size:10px;letter-spacing:.01em;margin-top:1px;}
  .tag-gold{color:#C8A84B;}
  .tag-white{color:#fff;opacity:.6;}
  .tag-dark{color:#0F2137;opacity:.55;}
</style></head><body>
<div class="row">
  <div class="sw">
    <div class="chip" style="background:#0F2137;"><span class="tag-gold">primary · base</span></div>
    <div class="meta"><div class="name">temple-blue</div><div class="hex">#0F2137</div></div>
  </div>
  <div class="sw">
    <div class="chip" style="background:#24446E;"><span class="tag-white">hover</span></div>
    <div class="meta"><div class="name">blue-hover</div><div class="hex">#24446E</div></div>
  </div>
  <div class="sw">
    <div class="chip" style="background:#061425;"><span class="tag-white">pressed</span></div>
    <div class="meta"><div class="name">blue-pressed</div><div class="hex">#061425</div></div>
  </div>
  <div class="sw">
    <div class="chip" style="background:#C8A84B;"><span class="tag-dark">accent · base</span></div>
    <div class="meta"><div class="name">temple-gold</div><div class="hex">#C8A84B</div></div>
  </div>
  <div class="sw">
    <div class="chip" style="background:#F5D98A;"><span class="tag-dark">gold · light</span></div>
    <div class="meta"><div class="name">gold-light</div><div class="hex">#F5D98A</div></div>
  </div>
</div>
</body></html>
