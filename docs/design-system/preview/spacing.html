<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8">
<style>
@font-face{font-family:'Open Sans';font-style:normal;font-weight:300 800;font-stretch:75% 125%;font-display:swap;src:url('../fonts/OpenSans-VariableFont_wdth_wght.ttf') format('truetype-variations'),url('../fonts/OpenSans-VariableFont_wdth_wght.ttf') format('truetype');}
@font-face{font-family:'Open Sans';font-style:italic;font-weight:300 800;font-stretch:75% 125%;font-display:swap;src:url('../fonts/OpenSans-Italic-VariableFont_wdth_wght.ttf') format('truetype-variations'),url('../fonts/OpenSans-Italic-VariableFont_wdth_wght.ttf') format('truetype');}
</style>

<title>Spacing</title>
<style>
  body{margin:0;font-family:'Open Sans','Segoe UI',Arial,sans-serif;background:#fff;padding:20px;color:#1E293B;}
  .row{display:flex;align-items:center;gap:14px;padding:5px 0;}
  .bar{background:#0F2137;height:12px;border-radius:2px;}
  .lbl{width:70px;font-weight:600;font-size:12px;color:#0F2137;}
  .v{font-family:SFMono-Regular,Menlo,monospace;font-size:10.5px;color:#94A3B8;margin-left:auto;}
</style></head><body>
<div class="row"><div class="lbl">space-1</div><div class="bar" style="width:4px"></div><div class="v">0.25rem · 4px</div></div>
<div class="row"><div class="lbl">space-2</div><div class="bar" style="width:8px"></div><div class="v">0.5rem · 8px</div></div>
<div class="row"><div class="lbl">space-3</div><div class="bar" style="width:12px"></div><div class="v">0.75rem · 12px</div></div>
<div class="row"><div class="lbl">space-4</div><div class="bar" style="width:16px"></div><div class="v">1rem · 16px</div></div>
<div class="row"><div class="lbl">space-5</div><div class="bar" style="width:20px"></div><div class="v">1.25rem · 20px</div></div>
<div class="row"><div class="lbl">space-6</div><div class="bar" style="width:24px"></div><div class="v">1.5rem · 24px</div></div>
<div class="row"><div class="lbl">space-8</div><div class="bar" style="width:32px"></div><div class="v">2rem · 32px</div></div>
<div class="row"><div class="lbl">space-10</div><div class="bar" style="width:40px"></div><div class="v">2.5rem · 40px</div></div>
<div class="row"><div class="lbl">space-12</div><div class="bar" style="width:48px"></div><div class="v">3rem · 48px</div></div>
</body></html>
