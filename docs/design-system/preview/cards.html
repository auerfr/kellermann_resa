<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8">
<style>
@font-face{font-family:'Open Sans';font-style:normal;font-weight:300 800;font-stretch:75% 125%;font-display:swap;src:url('../fonts/OpenSans-VariableFont_wdth_wght.ttf') format('truetype-variations'),url('../fonts/OpenSans-VariableFont_wdth_wght.ttf') format('truetype');}
@font-face{font-family:'Open Sans';font-style:italic;font-weight:300 800;font-stretch:75% 125%;font-display:swap;src:url('../fonts/OpenSans-Italic-VariableFont_wdth_wght.ttf') format('truetype-variations'),url('../fonts/OpenSans-Italic-VariableFont_wdth_wght.ttf') format('truetype');}
</style>

<title>Cards</title>
<style>
  body{margin:0;font-family:'Open Sans','Segoe UI',Arial,sans-serif;background:#F8FAFC;padding:18px;color:#1E293B;}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .card{background:#fff;border-radius:12px;border:1px solid #F1F5F9;box-shadow:0 1px 4px rgba(0,0,0,.08);overflow:hidden;}
  .card.accent{border-left:4px solid #F59E0B;background:#FFFBEB;}
  .head{background:#0F2137;color:#C8A84B;font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:600;padding:10px 14px;}
  .body{padding:14px;font-size:13px;}
  .eyebrow{font-size:11px;color:#94A3B8;text-transform:uppercase;letter-spacing:.08em;font-weight:600;margin-bottom:4px;}
  .big{font-size:1.1rem;font-weight:700;color:#0F2137;margin-bottom:4px;}
  .badge{background:#0F2137;color:#C8A84B;font-size:11px;font-weight:600;padding:2px 8px;border-radius:4px;}
  .kpi{background:linear-gradient(135deg,#0F2137,#1a3a5c);color:#C8A84B;border-radius:16px;padding:16px;box-shadow:0 4px 15px rgba(15,33,55,.25);position:relative;}
  .kpi .icon{position:absolute;top:10px;right:14px;font-size:1.5rem;opacity:.95;filter:sepia(.4) saturate(3) hue-rotate(5deg) brightness(1.1);}
  .kpi .num{font-size:2.2rem;font-weight:700;line-height:1;color:#C8A84B;}
  .kpi .lbl{font-size:12px;color:#E2E8F0;opacity:.85;margin-top:2px;}
</style></head><body>
<div class="grid">
  <div class="card">
    <div class="head">Prochaine tenue</div>
    <div class="body">
      <div class="big">vendredi 12 septembre 2026</div>
      <span class="badge">Temple Lafayette</span>
      <span style="color:#64748B;font-size:12px;margin-left:6px;">19h00 – 22h30</span>
    </div>
  </div>
  <div class="kpi">
    <div class="icon">🏛</div>
    <div class="num">42</div>
    <div class="lbl">Réservations</div>
  </div>
  <div class="card accent">
    <div class="body">
      <div class="eyebrow" style="color:#92400E;">⏳ Demandes en attente <span style="background:#F59E0B;color:#fff;padding:1px 7px;border-radius:99px;margin-left:4px;">3</span></div>
      <div style="font-size:13px;color:#78350F;margin-top:4px;">Action requise — 3 loges en attente de validation.</div>
    </div>
  </div>
  <div class="card">
    <div class="body" style="text-align:center;">
      <div style="font-size:2rem;">🚪</div>
      <div class="big" style="margin-top:6px;font-size:14px;">Réserver des cabinets</div>
      <div style="font-size:12px;color:#64748B;">Cabinets de réflexion pour travaux préparatoires.</div>
    </div>
  </div>
</div>
</body></html>
