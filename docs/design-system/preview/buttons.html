<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8">
<style>
@font-face{font-family:'Open Sans';font-style:normal;font-weight:300 800;font-stretch:75% 125%;font-display:swap;src:url('../fonts/OpenSans-VariableFont_wdth_wght.ttf') format('truetype-variations'),url('../fonts/OpenSans-VariableFont_wdth_wght.ttf') format('truetype');}
@font-face{font-family:'Open Sans';font-style:italic;font-weight:300 800;font-stretch:75% 125%;font-display:swap;src:url('../fonts/OpenSans-Italic-VariableFont_wdth_wght.ttf') format('truetype-variations'),url('../fonts/OpenSans-Italic-VariableFont_wdth_wght.ttf') format('truetype');}
</style>

<title>Buttons</title>
<style>
  body{margin:0;font-family:'Open Sans','Segoe UI',Arial,sans-serif;background:#fff;padding:20px;color:#1E293B;}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px;}
  button{font-family:inherit;font-weight:500;font-size:.875rem;border-radius:6px;padding:.45rem .9rem;border:1px solid transparent;cursor:pointer;transition:all .15s;}
  .primary{background:#0F2137;color:#fff;}
  .primary:hover{background:#1a3a5c;}
  .gold{background:#0F2137;color:#C8A84B;font-weight:600;}
  .success{background:#22C55E;color:#fff;border:none;}
  .danger{background:#EF4444;color:#fff;}
  .outline{background:#fff;border:1px solid #E2E8F0;color:#64748B;}
  .outline:hover{background:#F1F5F9;color:#1E293B;border-color:#CBD5E1;}
  .link{background:transparent;color:#0F2137;border:none;text-decoration:none;padding:.4rem .5rem;font-weight:500;}
  .link:hover{color:#1a3a5c;}
  .sm{font-size:.78rem;padding:.3rem .6rem;}
  .lg{font-size:1rem;padding:.85rem 1.5rem;}
  h4{margin:0 0 8px;font-size:10.5px;color:#94A3B8;text-transform:uppercase;letter-spacing:.08em;font-weight:600;}
</style></head><body>
<h4>Primary</h4>
<div class="row">
  <button class="primary">Soumettre la demande</button>
  <button class="gold">+ Nouvelle demande</button>
  <button class="primary lg">Accéder au calendrier →</button>
</div>
<h4>Semantic</h4>
<div class="row">
  <button class="success sm">➕ Réservation directe</button>
  <button class="danger sm">🔒 Bloquer un créneau</button>
</div>
<h4>Outline / Link</h4>
<div class="row">
  <button class="outline sm">📂 Importer Excel</button>
  <button class="outline sm">📋 Journal</button>
  <button class="outline sm">📅 Saison ▾</button>
  <button class="link">← Retour à l'accueil</button>
</div>
</body></html>
