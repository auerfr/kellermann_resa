<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8">
<style>
@font-face{font-family:'Open Sans';font-style:normal;font-weight:300 800;font-stretch:75% 125%;font-display:swap;src:url('../fonts/OpenSans-VariableFont_wdth_wght.ttf') format('truetype-variations'),url('../fonts/OpenSans-VariableFont_wdth_wght.ttf') format('truetype');}
@font-face{font-family:'Open Sans';font-style:italic;font-weight:300 800;font-stretch:75% 125%;font-display:swap;src:url('../fonts/OpenSans-Italic-VariableFont_wdth_wght.ttf') format('truetype-variations'),url('../fonts/OpenSans-Italic-VariableFont_wdth_wght.ttf') format('truetype');}
</style>

<title>Neutrals</title>
<style>
  body{margin:0;font-family:'Open Sans','Segoe UI',Arial,sans-serif;background:#fff;padding:20px;color:#1E293B;}
  .row{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;}
  .sw{border-radius:8px;overflow:hidden;border:1px solid #E2E8F0;}
  .chip{height:66px;}
  .meta{padding:6px 8px;font-size:10.5px;}
  .name{font-weight:600;color:#1E293B;}
  .hex{color:#94A3B8;font-family:SFMono-Regular,Menlo,monospace;font-size:10px;}
</style></head><body>
<div class="row">
  <div class="sw"><div class="chip" style="background:#F8FAFC"></div><div class="meta"><div class="name">surface</div><div class="hex">#F8FAFC</div></div></div>
  <div class="sw"><div class="chip" style="background:#F1F5F9"></div><div class="meta"><div class="name">surface-2</div><div class="hex">#F1F5F9</div></div></div>
  <div class="sw"><div class="chip" style="background:#E2E8F0"></div><div class="meta"><div class="name">border</div><div class="hex">#E2E8F0</div></div></div>
  <div class="sw"><div class="chip" style="background:#CBD5E1"></div><div class="meta"><div class="name">border-strong</div><div class="hex">#CBD5E1</div></div></div>
  <div class="sw"><div class="chip" style="background:#94A3B8"></div><div class="meta"><div class="name">text-muted</div><div class="hex">#94A3B8</div></div></div>
  <div class="sw"><div class="chip" style="background:#64748B"></div><div class="meta"><div class="name">text-sub</div><div class="hex">#64748B</div></div></div>
  <div class="sw"><div class="chip" style="background:#1E293B"></div><div class="meta"><div class="name">text</div><div class="hex">#1E293B</div></div></div>
</div>
</body></html>
