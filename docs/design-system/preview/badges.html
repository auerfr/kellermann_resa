<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8">
<style>
@font-face{font-family:'Open Sans';font-style:normal;font-weight:300 800;font-stretch:75% 125%;font-display:swap;src:url('../fonts/OpenSans-VariableFont_wdth_wght.ttf') format('truetype-variations'),url('../fonts/OpenSans-VariableFont_wdth_wght.ttf') format('truetype');}
@font-face{font-family:'Open Sans';font-style:italic;font-weight:300 800;font-stretch:75% 125%;font-display:swap;src:url('../fonts/OpenSans-Italic-VariableFont_wdth_wght.ttf') format('truetype-variations'),url('../fonts/OpenSans-Italic-VariableFont_wdth_wght.ttf') format('truetype');}
</style>

<title>Badges</title>
<style>
  body{margin:0;font-family:'Open Sans','Segoe UI',Arial,sans-serif;background:#fff;padding:20px;color:#1E293B;}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px;}
  .b{font-size:12px;font-weight:600;padding:3px 8px;border-radius:4px;letter-spacing:.02em;}
  .pill{border-radius:99px;padding:3px 10px;}
  h4{margin:0 0 8px;font-size:10.5px;color:#94A3B8;text-transform:uppercase;letter-spacing:.08em;font-weight:600;}
</style></head><body>
<h4>Temple / Gold on navy</h4>
<div class="row">
  <span class="b" style="background:#0F2137;color:#C8A84B;">Temple Lafayette</span>
  <span class="b" style="background:#0F2137;color:#C8A84B;">Temple Égalité</span>
  <span class="b" style="background:#0F2137;color:#C8A84B;">LV</span>
</div>
<h4>Statut (soft)</h4>
<div class="row">
  <span class="b" style="background:#DCFCE7;color:#166534;">Validée</span>
  <span class="b" style="background:#FEF9C3;color:#92400E;">En attente</span>
  <span class="b" style="background:#FEE2E2;color:#991B1B;">Refusée</span>
  <span class="b" style="background:#DBEAFE;color:#1E40AF;">Accès portail</span>
  <span class="b" style="background:#EDE9FE;color:#5B21B6;">Haut grade</span>
</div>
<h4>Solid + pill</h4>
<div class="row">
  <span class="b" style="background:#22C55E;color:#fff;">Validée</span>
  <span class="b" style="background:#F59E0B;color:#fff;">En attente</span>
  <span class="b" style="background:#EF4444;color:#fff;">Refusée</span>
  <span class="b pill" style="background:#F59E0B;color:#fff;">3</span>
  <span class="b pill" style="background:#3B82F6;color:#fff;">5</span>
</div>
<h4>Type / rite</h4>
<div class="row">
  <span class="b" style="background:#0d6e6e;color:#fff;">Loge bleue</span>
  <span class="b" style="background:#0F2137;color:#C8A84B;">REAA</span>
  <span class="b" style="background:#92400E;color:#fff;">Agapes</span>
</div>
</body></html>
